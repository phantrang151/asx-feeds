name: Deploy Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "backend:${{ github.sha }}" \
            .

      - name: Look up registry login server
        id: acr
        run: |
          echo "login_server=$(az acr show --name "${{ secrets.ACR_NAME }}" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image "${{ steps.acr.outputs.login_server }}/backend:${{ github.sha }}"
