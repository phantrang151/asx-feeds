name: Test

# Runs on every PR, and is also called by the deploy workflows (workflow_call) so a push to
# main only deploys after these jobs pass - there's no separate push trigger here, or the tests
# would run twice on main.
on:
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # The annotate-failures plugin turns each failing test into a GitHub annotation, so the
      # failure shows on the PR page instead of only in the raw log.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      - name: Run unit tests
        run: pytest --ignore=tests/integration -m "not slow" -v

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      # Pinned, not `latest`: a new CLI release can change behaviour (e.g. its env output) and
      # break CI with no code change. Bump deliberately.
      - name: Start local Supabase stack
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - run: supabase start

      # Captures the local stack's own URL/keys at runtime rather than hardcoding
      # them - avoids depending on the CLI's default local dev credentials staying the
      # same across versions. `supabase status -o env` prints KEY="value", and $GITHUB_ENV
      # keeps quotes as part of the value - so they are stripped here, otherwise
      # SUPABASE_DB_URL is literally "postgresql://..." (quotes included) and the schema step
      # can't connect.
      - name: Export local Supabase connection details
        run: |
          supabase status -o env | sed \
            -e 's/^API_URL=/SUPABASE_URL=/' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_KEY=/' \
            -e 's/^DB_URL=/SUPABASE_DB_URL=/' \
            -e 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Apply schema
        run: python -m scripts.apply_schema

      - name: Run integration tests
        run: pytest tests/integration -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npx jest --ci

      # Same static export the frontend deploy runs. Placeholder values: the build only needs
      # these set, and this job never deploys anything.
      - name: Check the site builds
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
