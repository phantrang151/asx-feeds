[pytest]
testpaths = tests
# Repo root on sys.path, so `pytest` (not just `python -m pytest`) can import db/, agent/, etc.
# from test folders without an __init__.py, e.g. tests/system/.
pythonpath = .
markers =
    slow: makes a real LLM call or hits a real network/DB - not run on every push, see docs/test_case_catalog.md
    integration: hits a real local Supabase instance - requires `supabase start`, see tests/integration/conftest.py
